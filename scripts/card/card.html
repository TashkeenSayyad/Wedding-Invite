<!doctype html>
<!--
  The invitation card. The ornament — the gilded frame, the cusped arch, the floral borders and
  the lotus at the foot — is a Canva design ("Pakistani Sindhi wedding invitation", DAHaX0V1Flw),
  exported with its text layers deleted and cleaned by clean-frame.py into frame.png. The type is
  set here, over it, in the site's own faces: Canva set the Bismillah as garbled Arabic and the
  names in a generic serif, so none of its text was kept.

  scripts/build-card.mjs renders this page and writes both cuts (card-print.png, card-web.webp).

  THE DATE LINE IS PINNED. DateMask lays a leaf of gold over 15–85% of the width and 71.6–76.5%
  of the height (styles.css .datemask) until the heart on s2 is scratched. The date is centred on
  74.1% and nothing else may enter that box — build-card.mjs checks. The band sits that high
  because below about 77% the frame's lower arch closes in under its ends.
-->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Italianno;src:url(../../node_modules/@fontsource/italianno/files/italianno-latin-400-normal.woff2)}
@font-face{font-family:CSC;font-weight:600;src:url(../../node_modules/@fontsource/cormorant-sc/files/cormorant-sc-latin-600-normal.woff2)}
@font-face{font-family:CSC;font-weight:700;src:url(../../node_modules/@fontsource/cormorant-sc/files/cormorant-sc-latin-700-normal.woff2)}
@font-face{font-family:CG;font-style:italic;font-weight:500;src:url(../../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2)}
@font-face{font-family:Naskh;font-weight:700;src:url(../../node_modules/@fontsource/noto-naskh-arabic/files/noto-naskh-arabic-arabic-700-normal.woff2)}
html,body{margin:0;background:#000}
svg{display:block}
</style></head>
<body>
<svg id="c" xmlns="http://www.w3.org/2000/svg" width="1191" height="1680" viewBox="0 0 1191 1680"></svg>
<script>
const W = 1191, H = 1680, CX = W / 2;
const DATE_Y = H * 0.741;
const MASK = { x0: W * .15, x1: W * .85, y0: H * .716, y1: H * .765 };
const f = (n) => +n.toFixed(2);

const petal = (len, w) => `M0,0 C${f(w)},${f(-len*.32)} ${f(w*.7)},${f(-len*.78)} 0,${f(-len)} C${f(-w*.7)},${f(-len*.78)} ${f(-w)},${f(-len*.32)} 0,0 Z`;
function rosette(x, y, r, n, rot = 0, w = .36) {
  let s = `<g transform="translate(${f(x)},${f(y)})">`;
  for (let i = 0; i < n; i++) s += `<path class="g" d="${petal(r, r*w)}" transform="rotate(${f(rot + 360*i/n)})"/>`;
  return s + `</g>`;
}
const dot = (x, y, r, cls = "g") => `<circle class="${cls}" cx="${f(x)}" cy="${f(y)}" r="${f(r)}"/>`;
const taper = (x0, x1, y, w) => { const m = (x0 + x1) / 2;
  return `<path class="g" d="M${f(x0)},${f(y)} Q${f(m)},${f(y - w)} ${f(x1)},${f(y)} Q${f(m)},${f(y + w)} ${f(x0)},${f(y)} Z"/>`; };
const lozenge = (x, y, rx, ry) => `<path class="g" d="M${f(x)},${f(y-ry)} L${f(x+rx)},${f(y)} L${f(x)},${f(y+ry)} L${f(x-rx)},${f(y)} Z"/>`;

function divider(y, half) {
  let s = rosette(CX, y, 12, 8, 22.5, .38) + dot(CX, y, 3, "wine");
  for (const k of [-1, 1]) {
    s += lozenge(CX + k*28, y, 6, 4.5);
    s += taper(CX + k*40, CX + k*half, y, 1.5);
    s += dot(CX + k*(half + 8), y, 2.8);
    s += `<path class="g" d="${petal(13, 4.6)}" transform="translate(${f(CX + k*(half - 36))},${f(y)}) rotate(${k*-60})"/>`;
    s += `<path class="g" d="${petal(13, 4.6)}" transform="translate(${f(CX + k*(half - 36))},${f(y)}) rotate(${k*-120})"/>`;
  }
  return s;
}

const out = [];
out.push(`<defs>
  <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="170" spreadMethod="reflect">
    <stop offset="0" stop-color="#8a5a22"/><stop offset=".35" stop-color="#c48a40"/>
    <stop offset=".58" stop-color="#f3d496"/><stop offset=".78" stop-color="#cf9a4f"/><stop offset="1" stop-color="#8f5f25"/>
  </linearGradient>
  <!-- the gold of the type matches the bronze-gold Canva drew the frame in, a little lighter so
       it reads as the brightest thing on the card -->
  <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbe6b4"/><stop offset=".4" stop-color="#ecc47c"/>
    <stop offset=".72" stop-color="#cf9a4c"/><stop offset="1" stop-color="#a26c2c"/>
  </linearGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff8ea"/><stop offset=".6" stop-color="#f5e3c2"/><stop offset="1" stop-color="#dcbf8e"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#9a2236" stop-opacity=".4"/><stop offset="1" stop-color="#9a2236" stop-opacity="0"/>
  </radialGradient>
  <filter id="foil" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="h"/>
    <feSpecularLighting in="h" surfaceScale="2.4" specularConstant="1" specularExponent="18" lighting-color="#fff2d2" result="s">
      <feDistantLight azimuth="225" elevation="52"/>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
    <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k2="1" k3=".5" result="lit"/>
    <feDropShadow in="lit" dx="0" dy="1.8" stdDeviation="1.6" flood-color="#0e0103" flood-opacity=".85"/>
  </filter>
  <filter id="foilBig" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="h"/>
    <feSpecularLighting in="h" surfaceScale="4" specularConstant="1" specularExponent="16" lighting-color="#fff2d2" result="s">
      <feDistantLight azimuth="225" elevation="50"/>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
    <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k2="1" k3=".45" result="lit"/>
    <feDropShadow in="lit" dx="0" dy="3" stdDeviation="3" flood-color="#0e0103" flood-opacity=".9"/>
  </filter>
  <filter id="press" x="-5%" y="-20%" width="110%" height="140%">
    <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0e0103" flood-opacity=".9"/>
  </filter>
</defs>
<style>.g{fill:url(#gold)} .gs{fill:none;stroke:url(#gold);stroke-linecap:round} .wine{fill:#3a0610}</style>`);

out.push(`<image href="frame.png" x="0" y="0" width="${W}" height="${H}"/>`);
// a soft warmth behind the title and names, as if the niche were lit
out.push(`<ellipse cx="${CX}" cy="640" rx="420" ry="520" fill="url(#glow)"/>`);

const orn = [];
orn.push(divider(652, 180));
orn.push(divider(1150, 170));
for (const k of [-1, 1]) {
  const y = 884;
  orn.push(taper(CX + k*58, CX + k*196, y, 1.3));
  orn.push(`<path class="gs" stroke-width="1.8" d="M${CX + k*196},${y} C${CX + k*218},${y - 2} ${CX + k*228},${y - 20} ${CX + k*216},${y - 28} C${CX + k*206},${y - 34} ${CX + k*196},${y - 22} ${CX + k*206},${y - 16}"/>`);
  orn.push(`<path class="g" d="${petal(15, 5)}" transform="translate(${CX + k*146},${y}) rotate(${k*55})"/>`);
  orn.push(`<path class="g" d="${petal(15, 5)}" transform="translate(${CX + k*146},${y}) rotate(${k*125})"/>`);
  orn.push(dot(CX + k*104, y, 2.5));
}
out.push(`<g filter="url(#foil)">${orn.join("")}</g>`);

const text = (id, y, size, family, o, str) => {
  const { weight = 400, style = "normal", ls = 0, fill = "url(#goldText)", filter = "foil" } = o;
  out.push(`<text id="${id}" x="${CX}" y="${y}" text-anchor="middle" font-family="${family}" font-size="${size}"
    font-weight="${weight}" font-style="${style}" letter-spacing="${ls}" fill="${fill}" filter="url(#${filter})">${str}</text>`);
};
text("bism", 268, 40, "Naskh", { weight: 700 }, "بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ");
text("fam", 352, 22, "CSC", { weight: 600, ls: 6.5 }, "TOGETHER WITH THEIR FAMILIES");
text("t1", 484, 146, "Italianno", { filter: "foilBig" }, "Baarat");
text("t2", 592, 146, "Italianno", { filter: "foilBig" }, "&amp; Rukhsati");
text("n1", 764, 80, "CSC", { weight: 600, ls: 12, fill: "url(#cream)", filter: "press" }, "TASHKEEN");
text("p1", 820, 32, "CG", { weight: 500, style: "italic", fill: "#f1dcb8", filter: "press" }, "son of Jallal Hyder &amp; Rubina");
text("amp", 916, 112, "Italianno", { filter: "foilBig" }, "&amp;");
text("n2", 1006, 80, "CSC", { weight: 600, ls: 12, fill: "url(#cream)", filter: "press" }, "ANUSHA");
text("p2", 1062, 32, "CG", { weight: 500, style: "italic", fill: "#f1dcb8", filter: "press" }, "daughter of Barkat Ali &amp; Mumtaz");
text("date", 0, 36, "CSC", { weight: 700, ls: 5 }, "SUNDAY · 27 DECEMBER 2026");
text("venue", 1338, 32, "CG", { weight: 500, style: "italic", fill: "#f1dcb8", filter: "press" }, "Nerunkot Hall, Qasimabad · Hyderabad");

document.getElementById("c").innerHTML = out.join("\n");

const img = document.querySelector("image");
Promise.all([document.fonts.ready, img.decode ? img.decode().catch(() => {}) : null,
  new Promise((r) => { const i = new Image(); i.onload = r; i.onerror = r; i.src = "frame.png"; })]).then(() => {
  const d = document.getElementById("date");
  d.setAttribute("y", f(DATE_Y + 36 * .63 / 2));      // centre the capitals (cap height ≈ .63em) on DATE_Y
  const report = {};
  for (const t of document.querySelectorAll("text")) {
    const bb = t.getBBox();
    report[t.id] = { x0: f(bb.x), x1: f(bb.x + bb.width), y0: f(bb.y), y1: f(bb.y + bb.height) };
  }
  window.__layout = { report, mask: MASK };
  window.__ready = true;
});
</script>
</body></html>
